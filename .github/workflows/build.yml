name: Build Levi
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Prepare project
        run: |
          mkdir -p www
          cat > www/index.html <<'LEVIEOF'
          <!DOCTYPE html>
          <html lang="ar" dir="rtl">
          <head>
          <meta charset="utf-8">
          <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
          <title>LEVI</title>
          <style>
          :root{--bg:#000;--panel:#0d0d10;--line:#1c1c22;--red:#e11d2e;--txt:#f2f2f2;--dim:#8a8a94}
          *{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}
          html,body{height:100%;background:var(--bg);color:var(--txt);font-family:system-ui,sans-serif;overflow:hidden}
          button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
          #splash{position:fixed;inset:0;z-index:50;background:#000;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;overflow:hidden;transition:opacity .7s,transform .7s}
          #splash.out{opacity:0;transform:scale(1.15);pointer-events:none}
          #splash::before{content:"";position:absolute;inset:0;background:radial-gradient(circle at 50% 38%,#3a0a10 0,#000 62%)}
          .slash{position:absolute;height:3px;background:linear-gradient(90deg,transparent,#fff,transparent);width:140%;left:-20%;opacity:0;transform-origin:center}
          .s1{top:30%;transform:rotate(-24deg);animation:cut .5s .6s forwards}
          .s2{top:48%;transform:rotate(18deg);animation:cut .5s .85s forwards}
          .s3{top:62%;transform:rotate(-8deg);animation:cut .5s 1.1s forwards}
          @keyframes cut{0%{opacity:0;clip-path:inset(0 100% 0 0)}30%{opacity:1}100%{opacity:0;clip-path:inset(0 0 0 0)}}
          #hero{position:relative;width:min(92vw,420px);margin-bottom:-4px;transform:translateY(60%);opacity:0;animation:rise 1.2s .2s cubic-bezier(.2,.8,.2,1) forwards;filter:drop-shadow(0 0 30px #e11d2e66)}
          @keyframes rise{to{transform:none;opacity:1}}
          #logo{position:absolute;top:9vh;width:100%;text-align:center;font-family:'Bebas Neue',Impact,sans-serif;font-size:min(34vw,160px);letter-spacing:.14em;line-height:1;direction:ltr;padding-left:.14em}
          #logo span{display:inline-block;opacity:0;transform:translateY(-40px) skewX(-14deg);color:#fff;text-shadow:0 0 18px #e11d2e,0 0 2px #fff;animation:drop .5s forwards}
          #logo span:nth-child(1){animation-delay:1.3s}#logo span:nth-child(2){animation-delay:1.45s}
          #logo span:nth-child(3){animation-delay:1.6s}#logo span:nth-child(4){animation-delay:1.75s}
          #logo span:nth-child(5){animation-delay:1.9s;color:var(--red)}
          @keyframes drop{60%{transform:translateY(6px) skewX(-14deg)}to{opacity:1;transform:skewX(-14deg)}}
          #tag{position:absolute;bottom:7vh;z-index:2;color:var(--dim);font-size:14px;opacity:0;animation:fade 1s 2.6s forwards}
          @keyframes fade{to{opacity:1}}
          #app{position:fixed;inset:0;display:none;flex-direction:column}
          header{padding:calc(env(safe-area-inset-top) + 12px) 18px 12px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--line)}
          header b{font-family:'Bebas Neue',Impact,sans-serif;font-size:30px;letter-spacing:.2em;direction:ltr}
          header b i{color:var(--red);font-style:normal}
          .dot{width:9px;height:9px;border-radius:50%;background:#22c55e;box-shadow:0 0 8px #22c55e}
          main{flex:1;overflow:hidden;position:relative}
          .view{position:absolute;inset:0;display:none;flex-direction:column}
          .view.on{display:flex}
          nav{display:flex;border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom);background:var(--panel)}
          nav button{flex:1;padding:12px 0 9px;color:var(--dim);font-size:12px;display:flex;flex-direction:column;align-items:center;gap:2px}
          nav button .ic{font-size:21px}
          nav button.on{color:#fff}
          nav button.on .ic{filter:drop-shadow(0 0 6px var(--red))}
          #msgs{flex:1;overflow-y:auto;padding:14px;display:flex;flex-direction:column;gap:8px}
          .m{max-width:80%;padding:9px 13px;border-radius:16px;line-height:1.5;font-size:15px;white-space:pre-wrap}
          .me{align-self:flex-start;background:var(--red);border-bottom-right-radius:4px}
          .bot{align-self:flex-end;background:#17171c;border:1px solid var(--line);border-bottom-left-radius:4px}
          .card{align-self:center;width:100%;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:12px;text-align:center}
          .card .row{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-top:8px}
          .card button,.chip{background:#17171c;border:1px solid #2a2a33;border-radius:12px;padding:8px 14px;font-size:20px}
          .card button:active{background:var(--red)}
          .card h4{font-size:14px;color:var(--dim);font-weight:400}
          .xo{display:grid;grid-template-columns:repeat(3,64px);gap:6px;justify-content:center;margin-top:8px}
          .xo button{height:64px;font-size:30px;font-weight:900;padding:0}
          #bar{display:flex;gap:8px;padding:10px;border-top:1px solid var(--line);align-items:center}
          #bar input{flex:1;background:#121216;border:1px solid var(--line);border-radius:22px;padding:11px 16px;color:#fff;font:inherit;outline:none}
          #bar input:focus{border-color:var(--red)}
          .rb{width:42px;height:42px;border-radius:50%;background:var(--red);display:grid;place-items:center;font-size:18px}
          .rb.g{background:#17171c;border:1px solid #2a2a33}
          .item{display:flex;align-items:center;gap:12px;padding:14px 18px;border-bottom:1px solid var(--line)}
          .av{width:48px;height:48px;border-radius:50%;background:#17171c;border:2px solid var(--red);display:grid;place-items:center;font-size:22px}
          .item div.t{flex:1}.item small{color:var(--dim);display:block}
          .big{padding:20px;display:grid;gap:12px}
          .gc{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:18px;display:flex;align-items:center;gap:14px;text-align:right}
          .gc .e{font-size:34px}
          #call{position:fixed;inset:0;z-index:40;background:radial-gradient(circle at 50% 30%,#3a0a10,#000 70%);display:none;flex-direction:column;align-items:center;justify-content:space-around;padding:60px 20px}
          #call .av{width:140px;height:140px;font-size:64px;animation:pulse 1.6s infinite}
          @keyframes pulse{0%{box-shadow:0 0 0 0 #e11d2e88}100%{box-shadow:0 0 0 40px #e11d2e00}}
          #end{width:70px;height:70px;border-radius:50%;background:var(--red);font-size:28px}
          @media (prefers-reduced-motion:reduce){*{animation-duration:.01s!important;animation-delay:0s!important}}
          </style>
          </head>
          <body>
          <div id="splash" onclick="enter()">
          <div class="slash s1"></div><div class="slash s2"></div><div class="slash s3"></div>
          <div id="logo"><span>L</span><span>E</span><span>V</span><span>I</span><span>.</span></div>
          <svg id="hero" viewBox="0 0 400 480" xmlns="http://www.w3.org/2000/svg">
          <defs>
          <linearGradient id="hair" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2b2b33"/><stop offset="1" stop-color="#07070a"/></linearGradient>
          <linearGradient id="cape" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#1f3a2a"/><stop offset="1" stop-color="#08140d"/></linearGradient>
          </defs>
          <path d="M20 480 L50 340 Q200 280 350 340 L380 480Z" fill="url(#cape)"/>
          <path d="M150 330 L200 420 L250 330 L225 300 L175 300Z" fill="#e8e8ec"/>
          <path d="M165 300 Q200 360 235 300 L245 330 Q200 390 155 330Z" fill="#c8c8d0"/>
          <rect x="172" y="250" width="56" height="60" fill="#e8c9b4"/>
          <path d="M118 170 Q118 70 200 62 Q282 70 282 170 Q282 262 200 282 Q118 262 118 170Z" fill="#f1d3bd"/>
          <path d="M104 190 Q84 60 200 40 Q316 60 296 190 Q290 120 262 108 Q232 96 200 112 Q168 96 138 108 Q110 120 104 190Z" fill="url(#hair)"/>
          <path d="M118 160 L150 90 L170 150Z M282 160 L250 90 L230 150Z M200 112 L180 60 L222 66Z" fill="#0a0a0d"/>
          <path d="M142 176 Q168 160 188 178 Q168 196 142 186Z" fill="#fff"/>
          <path d="M258 176 Q232 160 212 178 Q232 196 258 186Z" fill="#fff"/>
          <circle cx="166" cy="178" r="12" fill="#15151b"/><circle cx="234" cy="178" r="12" fill="#15151b"/>
          <circle cx="170" cy="174" r="4" fill="#fff"/><circle cx="238" cy="174" r="4" fill="#fff"/>
          <path d="M136 160 L192 170 M264 160 L208 170" stroke="#0a0a0d" stroke-width="6" stroke-linecap="round"/>
          <path d="M186 238 Q200 244 214 238" stroke="#7a4b3a" stroke-width="3.5" fill="none" stroke-linecap="round"/>
          <path d="M232 196 L246 230" stroke="#e11d2e" stroke-width="3" opacity=".8"/>
          </svg>
          <div id="tag">المس الشاشة للدخول</div>
          </div>
          <style>
          .fld{width:100%;background:#121216;border:1px solid var(--line);border-radius:14px;padding:13px 15px;color:#fff;font:inherit;outline:none;margin-bottom:10px}
          .fld:focus{border-color:var(--red)}
          .btn{background:var(--red);border-radius:14px;padding:13px;font-weight:700;width:100%}
          .btn.o{background:none;border:1px solid #2a2a33}
          #auth{position:fixed;inset:0;z-index:30;display:none;flex-direction:column;justify-content:center;padding:30px;background:#000}
          #auth h1{font-family:'Bebas Neue',Impact,sans-serif;font-size:72px;letter-spacing:.2em;text-align:center;direction:ltr;margin-bottom:20px}
          #auth h1 i{color:var(--red);font-style:normal}
          #err{color:#f87171;font-size:13px;min-height:20px;text-align:center}
          #page{position:absolute;inset:0;overflow-y:auto}
          .post{border-bottom:1px solid var(--line);padding-bottom:10px}
          .ph{display:flex;align-items:center;gap:10px;padding:10px 14px}
          .pa{width:38px;height:38px;border-radius:50%;border:2px solid var(--red);object-fit:cover;display:grid;place-items:center;background:#17171c;font-weight:700;flex:none}
          .post img.pi{width:100%;display:block}
          .pf{padding:8px 14px}.pf p{margin-top:4px;font-size:14px}
          .pro{padding:20px;text-align:center}.pro .pa{width:96px;height:96px;margin:0 auto 10px;font-size:38px}
          .st{display:flex;justify-content:center;gap:28px;margin:14px 0}.st b{display:block;font-size:18px}.st small{color:var(--dim)}
          .gr{display:grid;grid-template-columns:repeat(3,1fr);gap:2px}.gr img{width:100%;aspect-ratio:1;object-fit:cover}
          .row2{display:flex;gap:8px;padding:0 20px}
          .top{display:flex;align-items:center;gap:10px;padding:10px 14px;border-bottom:1px solid var(--line);position:sticky;top:0;background:#000;z-index:2}
          .cv{position:absolute;inset:0;display:flex;flex-direction:column;background:#000;z-index:5}
          .cv #cm{flex:1;overflow-y:auto;padding:14px;display:flex;flex-direction:column;gap:8px}
          .gcard{align-self:center;max-width:92%;text-align:center;background:#0d0d10;border:1px solid #2a2a33;border-radius:16px;padding:10px 12px}
          .gcard button{font-size:24px;padding:6px 12px;margin:2px;background:#17171c;border:1px solid #2a2a33;border-radius:12px}
          .gcard .xo button{height:60px;font-size:28px;padding:0}.gcard button:disabled{opacity:.55}
          .gcard .row{margin-top:6px}
          .gm{display:flex;gap:8px;padding:8px 10px;border-top:1px solid var(--line);flex-wrap:wrap}
          .gm button{background:#17171c;border:1px solid #2a2a33;border-radius:12px;padding:8px 14px}
          .crow{display:flex;gap:40px}
          </style>
          <div id="auth">
          <h1>LEV<i>I</i></h1>
          <input id="au" class="fld" placeholder="اسم المستخدم (انكليزي)" autocapitalize="none" autocomplete="off" dir="ltr">
          <input id="ap" class="fld" type="password" placeholder="كلمة السر (6 أحرف+)" dir="ltr">
          <p id="err"></p>
          <button class="btn" onclick="A.auth(false)">دخول</button><br>
          <button class="btn o" onclick="A.auth(true)">حساب جديد</button>
          </div>
          <div id="app">
          <header><span class="dot"></span><b>LEV<i>I</i></b><span></span></header>
          <main><div id="page"></div></main>
          <nav>
          <button data-v="feed" onclick="A.tab('feed')"><span class="ic">🏠</span>الرئيسية</button>
          <button data-v="search" onclick="A.tab('search')"><span class="ic">🔍</span>بحث</button>
          <button data-v="new" onclick="A.tab('new')"><span class="ic">➕</span>نشر</button>
          <button data-v="chats" onclick="A.tab('chats')"><span class="ic">💬</span>رسائل</button>
          <button data-v="me" onclick="A.tab('me')"><span class="ic">👤</span>أنا</button>
          </nav>
          </div>
          <div id="call"><div class="av" id="cav"></div><div style="text-align:center"><h2 id="cn"></h2><p id="cs" style="color:var(--dim)"></p></div><div class="crow"><button id="cacc" class="rb" style="width:70px;height:70px;background:#22c55e;font-size:28px" onclick="A.accept()">📞</button><button id="end" onclick="A.hang()">📵</button></div><audio id="ra" autoplay></audio></div>
          <script type="module">
          const firebaseConfig = {
          apiKey: "AIzaSyD50lO9JV1K3dwulxzjqD3lveoo3rF1dbk",
          authDomain: "levi-935b7.firebaseapp.com",
          projectId: "levi-935b7",
          storageBucket: "levi-935b7.firebasestorage.app",
          messagingSenderId: "317273207442",
          appId: "1:317273207442:web:65fa578ff5f96621ae2c4b"
          };
          import {initializeApp} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
          import {getAuth,createUserWithEmailAndPassword,signInWithEmailAndPassword,onAuthStateChanged,signOut} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
          import {getFirestore,doc,getDoc,setDoc,updateDoc,addDoc,collection,query,where,orderBy,limit,onSnapshot,getDocs,arrayUnion,arrayRemove} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
          const app=initializeApp(firebaseConfig),auth=getAuth(app),db=getFirestore(app);
          const $=id=>document.getElementById(id);
          const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
          let me=null,meDoc=null,unsub=null,entered=false,ready=false,busy=false,cur='feed';
          const av=(a,n)=>a?`<img class="pa" src="${a}">`:`<div class="pa">${esc((n||'?')[0]).toUpperCase()}</div>`;
          const stop=()=>{if(unsub){unsub();unsub=null}};
          window.enter=()=>{if(entered)return;entered=true;$('splash').classList.add('out');setTimeout(()=>$('splash').remove(),800);route()};
          setTimeout(window.enter,5200);
          onAuthStateChanged(auth,async u=>{me=u;meDoc=null;
          if(u&&!busy)meDoc=(await getDoc(doc(db,'users',u.uid))).data()||null;
          ready=true;route()});
          function route(){if(!entered||!ready)return;
          $('auth').style.display=me?'none':'flex';$('app').style.display=me?'flex':'none';
          if(me){A.tab(cur);listenCalls()}else if(callUn){callUn();callUn=null}}
          function resize(file,max,q){return new Promise(r=>{const i=new Image();i.onload=()=>{
          const k=Math.min(1,max/Math.max(i.width,i.height)),c=document.createElement('canvas');
          c.width=i.width*k;c.height=i.height*k;c.getContext('2d').drawImage(i,0,0,c.width,c.height);r(c.toDataURL('image/jpeg',q))};
          i.src=URL.createObjectURL(file)})}
          let chatCtx=null,pc=null,stream=null,callCid=null,role=null,seen={A:0,B:0},callUn=null,inCall=false,callT=0;const cache={};
          const cref=cid=>doc(db,'chats',cid);
          const meta=(uid,cid,uname,last)=>setDoc(cref(cid),{members:[me.uid,uid],names:{[me.uid]:meDoc.username,[uid]:uname},last,ts:Date.now()},{merge:true});
          const xoWin=b=>{for(const[l,m,n]of[[0,1,2],[3,4,5],[6,7,8],[0,3,6],[1,4,7],[2,5,8],[0,4,8],[2,4,6]])if(b[l]!=='-'&&b[l]===b[m]&&b[l]===b[n])return b[l];return b.includes('-')?'':'D'};
          const xoHTML=(id,x)=>{const b=x.board.split(''),mine=x.turn===me.uid,w=xoWin(b);
          return `<div class="m gcard"><b>❌⭕ إكس أو</b> ${w?(w==='D'?'تعادل':(x[w]===me.uid?'فزت 🔥':'خسرت 😏')):(mine?'دورك':'دور الخصم')}<div class="xo">${b.map((c,i)=>`<button ${w||!mine||c!=='-'?'disabled':''} onclick="A.xoPlay('${id}',${i})">${c==='-'?'':c}</button>`).join('')}</div></div>`};
          const O=['✊','✋','✌️'];
          const rpsHTML=(id,x)=>{const P=x.picks||{},a=P[me.uid],t=P[x.a===me.uid?x.b:x.a];let body;
          if(a!=null&&t!=null)body=`أنت ${O[a]} — الخصم ${O[t]}<br><b>${a===t?'تعادل':((a-t+3)%3===1?'فزت 🔥':'خسرت 😏')}</b>`;
          else if(a!=null)body='اخترت '+O[a]+'، ننتظر الخصم...';
          else body=O.map((o,i)=>`<button onclick="A.rpsPick('${id}',${i})">${o}</button>`).join('');
          return `<div class="m gcard"><b>حجرة ورقة مقص</b><div class="row">${body}</div></div>`};
          const msgHTML=(id,x)=>x.type==='xo'?xoHTML(id,x):x.type==='rps'?rpsHTML(id,x):`<div class="m ${x.from===me.uid?'me':'bot'}">${esc(x.text)}</div>`;
          function showCall(n,s,inc){$('cn').textContent=n;$('cs').textContent=s;$('cav').textContent=(n||'?')[0].toUpperCase();$('cacc').style.display=inc?'grid':'none';$('call').style.display='flex'}
          function endLocal(){if(pc)pc.close();if(stream)stream.getTracks().forEach(t=>t.stop());pc=null;stream=null;inCall=false;callCid=null;$('call').style.display='none'}
          async function mkPc(cid){stream=await navigator.mediaDevices.getUserMedia({audio:true});
          pc=new RTCPeerConnection({iceServers:[{urls:'stun:stun.l.google.com:19302'}]});
          stream.getTracks().forEach(t=>pc.addTrack(t,stream));
          pc.ontrack=e=>{$('ra').srcObject=e.streams[0];$('ra').play().catch(()=>{})};
          pc.onicecandidate=e=>{if(e.candidate)updateDoc(cref(cid),{['call.ice'+role]:arrayUnion(JSON.stringify(e.candidate))})}}
          function listenCalls(){if(callUn)return;callUn=onSnapshot(query(collection(db,'chats'),where('members','array-contains',me.uid)),s=>s.docs.forEach(d=>handleCall(d.id,d.data())))}
          async function handleCall(cid,data){const c=data.call;if(!c)return;
          if(c.status==='ringing'&&c.from!==me.uid&&!inCall&&Date.now()-c.t<45000){inCall=true;callCid=cid;role='B';callT=c.t;showCall(c.name,'مكالمة واردة...',true)}
          else if(c.status==='ended'&&inCall&&callCid===cid&&c.t>=callT)endLocal();
          else if(inCall&&callCid===cid&&pc){
          if(role==='A'&&c.status==='active'&&c.answer&&!pc.remoteDescription){await pc.setRemoteDescription(JSON.parse(c.answer));$('cs').textContent='متصل 🔊'}
          const k=role==='A'?'B':'A',arr=c['ice'+k]||[];
          if(pc.remoteDescription)while(seen[k]<arr.length)await pc.addIceCandidate(JSON.parse(arr[seen[k]++])).catch(()=>{})}}
          const A=window.A={
          async auth(isNew){const u=$('au').value.trim().toLowerCase(),p=$('ap').value;$('err').textContent='';
          if(!/^[a-z0-9_.]{3,20}$/.test(u))return $('err').textContent='الاسم: حروف انكليزي وأرقام، 3 إلى 20';
          try{const email=u+'@levi.app';
          if(isNew){busy=true;const c=await createUserWithEmailAndPassword(auth,email,p);
          meDoc={username:u,name:u,bio:'',avatar:'',followers:[],following:[]};
          await setDoc(doc(db,'users',c.user.uid),meDoc);busy=false;me=c.user;cur='me';route()}
          else await signInWithEmailAndPassword(auth,email,p)}
          catch(e){busy=false;$('err').textContent=/email-already/.test(e.code)?'الاسم مستخدم':/weak/.test(e.code)?'كلمة السر ضعيفة':/invalid|not-found|wrong/.test(e.code)?'بيانات غلط':'خطأ: '+e.code}},
          tab(t){cur=t;stop();document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('on',b.dataset.v===t));
          const P=$('page');P.innerHTML='';
          if(t==='feed'){unsub=onSnapshot(query(collection(db,'posts'),orderBy('ts','desc'),limit(30)),s=>{
          P.innerHTML=s.docs.map(d=>{const p=d.data(),L=p.likes||[];return `<div class="post">
          <div class="ph" onclick="A.profile('${p.uid}')">${av(p.avatar,p.username)}<b>${esc(p.username)}</b></div>
          <img class="pi" src="${p.img}"><div class="pf"><button onclick="A.like('${d.id}',${L.includes(me.uid)})" style="font-size:22px">${L.includes(me.uid)?'❤️':'🤍'}</button> ${L.length}
          ${p.cap?`<p><b>${esc(p.username)}</b> ${esc(p.cap)}</p>`:''}</div></div>`}).join('')||'<p style="text-align:center;color:var(--dim);margin-top:60px">ماكو منشورات. كون أول واحد ➕</p>'})}
          if(t==='search'){P.innerHTML='<div style="padding:12px"><input id="sq" class="fld" placeholder="دور على مستخدم..." dir="ltr" autocapitalize="none"></div><div id="sr"></div>';
          $('sq').oninput=async e=>{const q=e.target.value.trim().toLowerCase();if(!q)return $('sr').innerHTML='';
          const s=await getDocs(query(collection(db,'users'),where('username','>=',q),where('username','<=',q+'\uf8ff'),limit(20)));
          $('sr').innerHTML=s.docs.map(d=>{const u=d.data();return `<div class="item" onclick="A.profile('${d.id}')">${av(u.avatar,u.username)}<div class="t"><b>${esc(u.name||u.username)}</b><small>@${esc(u.username)}</small></div></div>`}).join('')||'<p style="text-align:center;color:var(--dim)">ماكو نتيجة</p>'}}
          if(t==='new'){P.innerHTML='<div style="padding:16px"><input id="nf" type="file" accept="image/*" class="fld"><textarea id="nc" class="fld" rows="3" placeholder="اكتب وصف..."></textarea><button class="btn" onclick="A.post()">نشر</button><p id="ne" style="color:var(--dim);text-align:center;margin-top:8px"></p></div>'}
          if(t==='chats'){unsub=onSnapshot(query(collection(db,'chats'),where('members','array-contains',me.uid)),s=>{
          const L=s.docs.map(d=>d.data()).sort((a,b)=>(b.ts||0)-(a.ts||0));
          P.innerHTML=L.map(c=>{const o=c.members.find(x=>x!==me.uid),n=c.names?.[o]||'?';
          return `<div class="item" onclick="A.chat('${o}')">${av('',n)}<div class="t"><b>${esc(n)}</b><small>${esc(c.last||'')}</small></div></div>`}).join('')||'<p style="text-align:center;color:var(--dim);margin-top:60px">ابحث عن شخص وراسله من بروفايله</p>'})}
          if(t==='me')A.profile(me.uid,true)},
          async like(id,liked){await updateDoc(doc(db,'posts',id),{likes:liked?arrayRemove(me.uid):arrayUnion(me.uid)})},
          async post(){const f=$('nf').files[0];if(!f)return $('ne').textContent='اختار صورة';$('ne').textContent='جاري النشر...';
          const img=await resize(f,900,.6);
          await addDoc(collection(db,'posts'),{uid:me.uid,username:meDoc.username,avatar:meDoc.avatar||'',img,cap:$('nc').value.trim(),likes:[],ts:Date.now()});
          A.tab('feed')},
          async profile(uid,own){stop();cur=own?'me':cur;const P=$('page'),isMe=uid===me.uid;
          const [u,ps]=await Promise.all([getDoc(doc(db,'users',uid)),getDocs(query(collection(db,'posts'),where('uid','==',uid)))]);
          const d=u.data();if(!d)return;const fol=(d.followers||[]).includes(me.uid);
          const posts=ps.docs.map(x=>x.data()).sort((a,b)=>b.ts-a.ts);
          P.innerHTML=`${isMe?'':'<div class="top"><button onclick="A.back()">→</button><b>@'+esc(d.username)+'</b></div>'}
          <div class="pro">${av(d.avatar,d.username)}<h2>${esc(d.name||d.username)}</h2><small style="color:var(--dim)">@${esc(d.username)}</small><p style="margin-top:8px">${esc(d.bio)}</p>
          <div class="st"><div><b>${posts.length}</b><small>منشور</small></div><div><b>${(d.followers||[]).length}</b><small>متابع</small></div><div><b>${(d.following||[]).length}</b><small>يتابع</small></div></div></div>
          <div class="row2">${isMe?'<button class="btn o" onclick="A.edit()">تعديل</button><button class="btn o" onclick="A.out()">خروج</button>'
          :`<button class="btn ${fol?'o':''}" onclick="A.follow('${uid}',${fol})">${fol?'إلغاء المتابعة':'متابعة'}</button><button class="btn o" onclick="A.chat('${uid}')">مراسلة</button>`}</div>
          <div class="gr" style="margin-top:16px">${posts.map(p=>`<img src="${p.img}">`).join('')}</div>`},
          async follow(uid,fol){const op=fol?arrayRemove:arrayUnion;
          await updateDoc(doc(db,'users',uid),{followers:op(me.uid)});await updateDoc(doc(db,'users',me.uid),{following:op(uid)});
          meDoc.following=fol?(meDoc.following||[]).filter(x=>x!==uid):[...(meDoc.following||[]),uid];A.profile(uid)},
          edit(){$('page').innerHTML=`<div style="padding:16px"><input id="en" class="fld" placeholder="الاسم" value="${esc(meDoc.name)}"><textarea id="eb" class="fld" rows="3" placeholder="نبذة">${esc(meDoc.bio)}</textarea>
          <input id="ef" type="file" accept="image/*" class="fld"><button class="btn" onclick="A.save()">حفظ</button></div>`},
          async save(){const f=$('ef').files[0],upd={name:$('en').value.trim(),bio:$('eb').value.trim()};
          if(f)upd.avatar=await resize(f,256,.7);await updateDoc(doc(db,'users',me.uid),upd);Object.assign(meDoc,upd);A.tab('me')},
          async out(){await signOut(auth)},
          async chat(uid){stop();const U=(await getDoc(doc(db,'users',uid))).data(),cid=[me.uid,uid].sort().join('_');
          chatCtx={uid,cid,uname:U.username};
          const P=$('page');P.innerHTML=`<div class="cv"><div class="top"><button onclick="A.back()">→</button>${av(U.avatar,U.username)}<b style="flex:1">${esc(U.name||U.username)}</b><button onclick="A.call()" style="font-size:22px">📞</button></div><div id="cm"></div>
          <div id="gm" class="gm" style="display:none"><button onclick="A.game('xo')">❌⭕ إكس أو</button><button onclick="A.game('rps')">✊ حجرة ورقة مقص</button></div>
          <div id="bar"><button class="rb g" onclick="A.gm()">🎮</button><input id="ci" placeholder="اكتب رسالة..." autocomplete="off"><button class="rb" onclick="A.send()">➤</button></div></div>`;
          $('ci').onkeydown=e=>{if(e.key==='Enter')A.send()};
          unsub=onSnapshot(query(collection(db,'chats',cid,'msgs'),orderBy('ts')),s=>{const m=$('cm');if(!m)return;
          m.innerHTML=s.docs.map(d=>{const x=d.data();cache[d.id]=x;return msgHTML(d.id,x)}).join('');m.scrollTop=1e9})},
          back(){A.tab(cur)},
          gm(){const g=$('gm');g.style.display=g.style.display==='none'?'flex':'none'},
          async send(){const t=$('ci').value.trim();if(!t)return;$('ci').value='';const {uid,cid,uname}=chatCtx;
          await meta(uid,cid,uname,t);await addDoc(collection(db,'chats',cid,'msgs'),{from:me.uid,text:t,ts:Date.now()})},
          async game(t){$('gm').style.display='none';const {uid,cid,uname}=chatCtx,ts=Date.now();
          const d=t==='xo'?{type:'xo',from:me.uid,X:me.uid,O:uid,board:'---------',turn:me.uid,ts}:{type:'rps',from:me.uid,a:me.uid,b:uid,picks:{},ts};
          await meta(uid,cid,uname,'🎮 لعبة');await addDoc(collection(db,'chats',cid,'msgs'),d)},
          async xoPlay(id,i){const x=cache[id],b=x.board.split(''),s=x.X===me.uid?'X':'O';if(x.turn!==me.uid||b[i]!=='-')return;b[i]=s;
          await updateDoc(doc(db,'chats',chatCtx.cid,'msgs',id),{board:b.join(''),turn:s==='X'?x.O:x.X})},
          async rpsPick(id,k){await updateDoc(doc(db,'chats',chatCtx.cid,'msgs',id),{['picks.'+me.uid]:k})},
          async call(){const {uid,cid,uname}=chatCtx;if(inCall)return;inCall=true;callCid=cid;role='A';seen={A:0,B:0};callT=Date.now();showCall(uname,'جاري الاتصال...',false);
          try{await meta(uid,cid,uname,'📞 مكالمة');await mkPc(cid);const o=await pc.createOffer();
          await updateDoc(cref(cid),{call:{from:me.uid,name:meDoc.username,status:'ringing',offer:JSON.stringify(o),answer:'',iceA:[],iceB:[],t:callT}});
          await pc.setLocalDescription(o)}catch(e){$('cs').textContent='تعذر: '+(e.name||e.message);setTimeout(endLocal,2500)}},
          async accept(){$('cacc').style.display='none';
          try{const c=(await getDoc(cref(callCid))).data().call;seen={A:0,B:0};await mkPc(callCid);await pc.setRemoteDescription(JSON.parse(c.offer));
          const a=await pc.createAnswer();await pc.setLocalDescription(a);
          await updateDoc(cref(callCid),{'call.answer':JSON.stringify(a),'call.status':'active'});$('cs').textContent='متصل 🔊';
          const arr=c.iceA||[];while(seen.A<arr.length)await pc.addIceCandidate(JSON.parse(arr[seen.A++])).catch(()=>{})}
          catch(e){$('cs').textContent='تعذر: '+(e.name||e.message)}},
          async hang(){if(callCid)await updateDoc(cref(callCid),{'call.status':'ended'}).catch(()=>{});endLocal()}
          };
          </script>
          </body>
          </html>
          LEVIEOF
          cat > package.json <<'EOF'
          {"name":"levi","version":"1.0.0","private":true,"dependencies":{"@capacitor/android":"6.1.2","@capacitor/cli":"6.1.2","@capacitor/core":"6.1.2"}}
          EOF
          cat > capacitor.config.json <<'EOF'
          {"appId":"com.levi.app","appName":"LEVI","webDir":"www","backgroundColor":"#000000"}
          EOF
      - run: npm install
      - run: npx cap add android
      - run: npx cap sync android
      - name: Icon and permissions
        run: |
          D=android/app/src/main/res
          sed -i 's#<application#<uses-permission android:name="android.permission.RECORD_AUDIO" /><uses-permission android:name="android.permission.MODIFY_AUDIO_SETTINGS" /><application#' android/app/src/main/AndroidManifest.xml
          mkdir -p $D/drawable $D/values $D/mipmap-anydpi-v26
          cat > $D/drawable/ic_fg.xml <<'EOF'
          <vector xmlns:android="http://schemas.android.com/apk/res/android" android:width="108dp" android:height="108dp" android:viewportWidth="108" android:viewportHeight="108"><path android:fillColor="#E11D2E" android:pathData="M38,28h12v42h22v10H38z"/></vector>
          EOF
          cat > $D/values/ic_launcher_background.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <resources><color name="ic_launcher_background">#000000</color></resources>
          EOF
          for n in ic_launcher ic_launcher_round; do
          cat > $D/mipmap-anydpi-v26/$n.xml <<'EOF2'
          <?xml version="1.0" encoding="utf-8"?>
          <adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android"><background android:drawable="@color/ic_launcher_background"/><foreground android:drawable="@drawable/ic_fg"/></adaptive-icon>
          EOF2
          done
          sed -i 's#@drawable/splash#@android:color/black#' $D/values/styles.xml || true
      - run: chmod +x android/gradlew && cd android && ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: Levi-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
